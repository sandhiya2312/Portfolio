<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Skills</title>

  <style>
    
    body {
      margin: 0;
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #fff, #ffe5c7);
      color: #333;
    }

    h1 {
      text-align: center;
      margin-top: 40px;
      font-family: 'Times New Roman', Times, serif;
      color: #222;
      font-size: 2.5rem;
    }

    h2 {
      text-align: center;
      margin: 50px 0 25px 0;
      font-weight: bold;
      color: #444;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    
    .skills-section {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 50px;
      margin-bottom: 60px;
    }

   
    .circle {
      width: 130px;
      height: 130px;
      background: white;
      border-radius: 50%;
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .circle:hover {
      transform: scale(1.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    .circle img {
      width: 60px;
      height: 60px;
      margin-bottom: 10px;
    }

    .circle span {
      font-size: 1rem;
      font-weight: 600;
      color: #222;
    }

    
    .circle::before {
      content: "";
      position: absolute;
      width: 140px;
      height: 140px;
      border-radius: 50%;
      z-index: -1;
      transition: all 0.4s ease;
    }

    .java::before { border: 5px solid #e53935; }
    .c::before { border: 5px solid #42a5f5; }
    .html::before { border: 5px solid #ff7043; }
    .css::before { border: 5px solid #1e88e5; }
    .javascript::before { border: 5px solid #fbc02d; }
    .react::before { border: 5px solid #61dafb; }
    .mysql::before { border: 5px solid #00758f; }
    .mongodb::before { border: 5px solid #4caf50; }

    .circle:hover::before {
      transform: rotate(180deg) scale(1.1);
      opacity: 0.8;
    }

    
    @media (max-width: 600px) {
      .circle {
        width: 100px;
        height: 100px;
      }

      .circle img {
        width: 45px;
        height: 45px;
      }

      .circle span {
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>
  <h1><b>MY SKILLS</b></h1>

 
  <h2>Programming Languages</h2>
  <div class="skills-section">
    <div class="circle java">
      <img src="https://upload.wikimedia.org/wikipedia/en/3/30/Java_programming_language_logo.svg" alt="Java">
      <span>Java</span>
    </div>
    <div class="circle c">
      <img src="https://upload.wikimedia.org/wikipedia/commons/1/18/C_Programming_Language.svg" alt="C">
      <span>C</span>
    </div>
  </div>

 
  <h2>Web Development</h2>
  <div class="skills-section">
    <div class="circle html">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/61/HTML5_logo_and_wordmark.svg" alt="HTML">
      <span>HTML</span>
    </div>
    <div class="circle css">
      <img src="https://upload.wikimedia.org/wikipedia/commons/d/d5/CSS3_logo_and_wordmark.svg" alt="CSS">
      <span>CSS</span>
    </div>
    <div class="circle javascript">
      <img src="https://upload.wikimedia.org/wikipedia/commons/6/6a/JavaScript-logo.png" alt="JavaScript">
      <span>JavaScript</span>
    </div>
    <div class="circle react">
      <img src="https://upload.wikimedia.org/wikipedia/commons/a/a7/React-icon.svg" alt="React">
      <span>React</span>
    </div>
    <div class="circle mongodb">
      <img src="Node.png" alt="Node.js">
      <span>Node.js</span>
    </div>
    <div class="circle javascript">
      <img src="Express.png" alt="Express.js">
      <span>Express.js</span>
    </div>
  </div>

  
  <h2>Database Management</h2>
  <div class="skills-section">
    <div class="circle mysql">
      <img src="https://upload.wikimedia.org/wikipedia/en/d/dd/MySQL_logo.svg" alt="MySQL">
      <span>MySQL</span>
    </div>
    <div class="circle mongodb">
      <img src="mongodb.png" alt="MongoDB">
      <span>MongoDB</span>
    </div>
  </div>

   <h2>Platforms</h2>
  <div class="skills-section">
    <div class="circle mongodb">
      <img src="Github.png" alt="Github">
      <span>Github</span>
    </div>
    <div class="circle mysql">
      <img src="Eclipse.png" alt="Eclipse">
      <span>Eclipse IDE</span>
    </div>
    <div class="circle c">
      <img src="VS code.jpg" alt="VS Code">
      <span>VS Code</span>
    </div>
    <div class="circle mongodb">
      <img src="Dev c++.jpg" alt="Dev C++">
      <span>Dev C++</span>
    </div>
    <div class="circle java">
      <img src="Figma.jpg" alt="Figma">
      <span>Figma</span>
    </div>
  </div>
</body>
</html>
